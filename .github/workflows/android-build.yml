name: Build Kryptos APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # NEW: This action automatically sets up Gradle without needing the gradlew file
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # CHANGED: Using 'gradle' command directly instead of './gradlew'
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Kryptos-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
